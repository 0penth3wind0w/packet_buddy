version: '3.6'

services:
  packet_buddy:
    image: 0penth3wind0w/packet_buddy:packet_buddy
    container_name: packet_buddy
    restart: always
    build: 
      context: ./
      dockerfile: ./docker/Dockerfile
    ports:
      - "8505:8505"
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./packet_buddy/config.toml:/root/.streamlit/config.toml
